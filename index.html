<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#062a59" />
  <title>Josh Evans Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app" class="app-shell">
  <header class="topbar">
    <button id="app-back" class="icon-btn app-back" data-action="app-back" aria-label="Go back" hidden>‹</button><span class="topbar-spacer" aria-hidden="true"></span>
    <button class="brand-lockup" data-nav="home" aria-label="Josh Evans Hub home">
      <img src="je-logo.png" alt="Josh Evans Soccer School" />
    </button>
    <div class="top-actions">
      <button class="icon-btn" data-action="open-more" aria-label="Profile">●</button>
    </div>
  </header>

  <nav class="main-nav" aria-label="Main navigation">
    <button data-nav="home" class="nav-pill is-active"><small>Home</small></button>
    <button data-nav="schedule" class="nav-pill"><small>Schedule</small></button>
    <button data-nav="resources" class="nav-pill"><small>Resources</small></button>
    <button data-nav="more" class="nav-pill"><small>More</small></button>
  </nav>

  <main id="screen-root" class="screen-root" aria-live="polite"></main>
</div>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-backdrop" data-action="close-sheet"></div>
  <div class="sheet-panel">
    <div class="sheet-handle"></div>
    <div id="sheet-content"></div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="content-provider.js"></script>
<script src="app.js"></script>
</body>
</html>
